server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API → FastAPI backend container
    location /api/ {
        # Style photos are posted as multipart; MAX_UPLOAD_MB is 8, so allow
        # a little headroom rather than letting nginx 413 the request before
        # FastAPI can return its own message.
        client_max_body_size 12m;
        proxy_pass http://backend:8080;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded style photos
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Hashed build assets. A miss here MUST 404 rather than fall through to
    # the SPA rule below: answering a .js request with index.html and a 200
    # makes the browser refuse the module — "Expected a JavaScript module
    # script but the server responded with a MIME type of text/html" — and
    # nothing mounts, so the page is simply white. That is what a rebuild
    # looks like to any browser still holding the previous index.html.
    location /assets/ {
        try_files $uri =404;
        # The names carry a content hash, so they are safe to cache for ever.
        # One header, not `expires` as well — that emits its own Cache-Control
        # and the response goes out carrying two.
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # The entry document names those hashed files, so a cached copy is what
    # sends a browser looking for a bundle that no longer exists. It is small;
    # fetch it every time.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
