server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API → FastAPI backend container
    location /api/ {
        # Style photos are posted as multipart; MAX_UPLOAD_MB is 8, so allow
        # a little headroom rather than letting nginx 413 the request before
        # FastAPI can return its own message.
        client_max_body_size 12m;
        proxy_pass http://backend:8080;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded style photos
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
